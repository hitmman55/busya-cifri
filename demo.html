<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9df79">
  <title>Буся и цифры</title>
  <style>
:root {
  color-scheme: light;
  font-family: 'Trebuchet MS', 'Noto Sans', system-ui, sans-serif;
  color: #412a24;
  background: #f9df79;
  font-synthesis: none;
  --ink: #412a24;
  --pink: #f6c5d3;
  --pink-shadow: #d497a9;
  --cream: #fffaf0;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 28% 32%, #ffedab 0%, transparent 58%),
    radial-gradient(#ad781e28 1px, transparent 1px) 0 0 / 18px 18px,
    #f9df79;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid #6f365d; outline-offset: 4px; }
h1:focus { outline: none; }

.game { max-width: 1080px; margin-inline: auto; padding: 36px 36px 46px; }
.header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 0 4px 21px; border-bottom: 1px solid #9a6e3538; }
.header-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.wordmark { display: flex; align-items: center; gap: 11px; font-weight: 800; font-size: clamp(1.2rem, 3vw, 1.6rem); letter-spacing: -.04em; }
.emblem { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid #d99caa; border-radius: 14px; background: var(--pink); color: #7f425b; font-size: 1.5rem; }
.menu-button { min-height: 44px; padding: 6px 14px; border: 1px solid #a87b43; border-radius: 13px; background: #fff4d2; cursor: pointer; font-weight: 800; }
.menu-button:hover { background: var(--cream); }
.progress { display: flex; justify-content: center; gap: 8px; list-style: none; margin: 0 0 19px; padding: 0; }
.progress li { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid #95642f79; background: #fff5cb; color: #655437; font-size: .75rem; font-weight: 800; }
.progress [aria-current="step"] { background: #874766; color: white; border-color: #874766; }
.progress .done { background: #e4ecc7; color: #47552a; border-color: #748149; }

.layout { display: grid; grid-template-columns: .74fr 1.58fr; gap: 44px; align-items: center; margin-top: 40px; }
.companion { position: relative; display: grid; justify-items: center; align-content: center; isolation: isolate; }
.companion::before { content: ""; position: absolute; width: 90%; aspect-ratio: 1; border-radius: 50%; background: #f6c852; opacity: .55; top: 6%; z-index: -1; }
.hero { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: contain; filter: drop-shadow(0 7px 3px #835d261c); }
.sparkle { position: absolute; color: #9c622d; font-size: 1.8rem; pointer-events: none; }
.sparkle-left { left: 4%; top: 44%; }
.sparkle-right { right: 1%; top: 12%; font-size: 2.5rem; }
.speech { position: relative; margin: 7px 0 0; max-width: 245px; padding: 15px 20px; border: 1px solid #e5b86c; border-radius: 21px; background: #fff5d7; text-align: center; line-height: 1.4; font-size: 1rem; font-weight: 700; }
.speech::before { content: ""; position: absolute; background: inherit; width: 12px; height: 12px; left: calc(50% - 7px); top: -7px; border: solid #e5b86c; border-width: 1px 0 0 1px; transform: rotate(45deg); }

.board { min-width: 0; min-height: 524px; padding: 33px clamp(16px, 4vw, 46px) 24px; border: 1px solid #d6aa5b; border-radius: 34px; background: var(--cream); box-shadow: 0 9px 0 #cd9b4657; text-align: center; }
h1 { margin: 0 0 23px; font-size: clamp(2rem, 5vw, 3.3rem); font-weight: 850; line-height: 1.08; letter-spacing: -.055em; }
.board:has(.modes:not([hidden])) { display: grid; align-content: center; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 10px auto 5px; width: min(100%, 470px); }
.modes button { min-height: 128px; padding: 13px 8px; border: 1px solid #c8849a; border-radius: 23px; background: var(--pink); box-shadow: 0 6px 0 var(--pink-shadow); font-size: clamp(1.55rem, 4vw, 2.4rem); font-weight: 850; cursor: pointer; }
.modes button:hover { background: #f9d5df; }
.modes button:nth-child(2) { border-color: #c49642; background: #ffe296; box-shadow: 0 6px 0 #e2bb63; }
.modes button:nth-child(2):hover { background: #ffecb9; }
.modes span { display: block; margin-top: 5px; font-size: .95rem; line-height: 1.3; }
.fruit-tray { display: grid; place-items: center; min-height: 215px; border-radius: 23px; background: #ffe8a7; padding: 16px 10px; }
.fruit-grid { display: flex; flex-wrap: wrap; justify-content: center; width: min(100%, 294px); }
.fruit-grid--wide { width: min(100%, 418px); }
.fruit { width: 33.333%; display: grid; place-items: center; aspect-ratio: 1.06; border-radius: 50%; }
.fruit-grid--wide .fruit { width: 20%; }
.fruit img { display: block; width: 83%; height: auto; aspect-ratio: 1; object-fit: contain; transform: rotate(var(--tilt, 0deg)); }
.fruit.lit { background: #fff6d3; outline: 3px solid #a65c3d; outline-offset: -4px; }
.lesson-tray { grid-template-columns: minmax(75px, .55fr) minmax(0, 1.45fr); gap: 12px; }
.lesson-numeral { display: grid; padding-inline: 4px; color: #79445b; font-weight: 850; }
.lesson-numeral strong { font-size: clamp(3.1rem, 9vw, 6.5rem); line-height: 1; letter-spacing: -.07em; }
.lesson-numeral span { margin-top: 7px; font-size: clamp(.93rem, 3.5vw, 1.35rem); }
.answers { display: flex; justify-content: center; gap: clamp(10px, 3vw, 20px); margin-top: 25px; }
.choice, .action { border: 1px solid #c8849a; border-radius: 19px; background: var(--pink); box-shadow: 0 5px 0 var(--pink-shadow); cursor: pointer; font-weight: 800; }
.choice { width: clamp(63px, 11vw, 108px); min-height: 72px; font-size: 2.25rem; line-height: 1; }
.choice:enabled:hover { background: #f9d5df; }
.choice:enabled:active, .action:active { transform: translateY(3px); }
.choice:enabled:active { box-shadow: 0 2px 0 var(--pink-shadow); }
.choice:disabled { cursor: default; }
.choice.wrong { background: #f6e6e5; box-shadow: 0 4px 0 #dec0be; }
.choice.correct { background: #e0ebbb; border-color: #718449; box-shadow: 0 5px 0 #a7b87a; }
.feedback { min-height: 1.5em; margin: 16px 0 8px; font-size: 1rem; font-weight: 700; line-height: 1.5; }
.action { min-height: 47px; padding: 7px 21px; border-radius: 15px; font-size: 1rem; background: #dce9b3; border-color: #75844e; box-shadow: 0 5px 0 #a6b876; color: #354027; }
.action:hover { background: #e7f0c8; }
.action:active { box-shadow: 0 2px 0 #a6b876; }
.lesson-tray ~ .action, .reward-tray ~ .action { margin-top: 19px; }

.reward-tray { padding: 0; overflow: hidden; }
.scene { position: relative; width: 100%; min-height: 260px; aspect-ratio: 1.72; overflow: hidden; isolation: isolate; }
.scene--flight { background: linear-gradient(155deg, #a9d6dc, #f3f5dc 72%, #ffedb7); }
.scene--balloon { background: radial-gradient(ellipse at 48% 105%, #ffd58d, transparent 76%), linear-gradient(#4e547f, #8a72a0 59%, #d8939b); }
.scene-sky { position: absolute; inset: 0; }
.cloud { position: absolute; display: block; width: 26%; height: 12%; border-radius: 70% 60% 80% 55%; background: #fff9e8; opacity: .8; }
.cloud::before, .cloud::after { content: ""; position: absolute; bottom: 24%; background: inherit; height: 150%; border-radius: 50%; }
.cloud::before { width: 44%; left: 20%; }
.cloud::after { width: 31%; left: 55%; height: 115%; }
.cloud--1 { left: 9%; top: 29%; }
.cloud--2 { left: 66%; top: 19%; transform: scale(.7); }
.cloud--3 { left: 65%; top: 82%; transform: scale(1.3); }
.scene--flight .scene-sky { animation: drift-clouds 7s ease-out both; }
.scene--balloon .cloud { opacity: .23; }
.scene-cast { position: absolute; z-index: 1; }
.scene-cast img { display: block; width: 100%; height: auto; }
.scene--flight .scene-cast { width: 63%; left: 19%; top: 48%; transform: translateY(-50%); animation: dragon-flight 6.5s ease-in-out both; }
.scene--balloon .scene-cast { inset: 7% 22%; animation: balloon-rise 6s ease-out both; }
.scene--balloon .scene-cast img { height: 100%; object-fit: contain; }
.scene-stars { position: absolute; z-index: 2; inset: 0; pointer-events: none; }
.scene-star { position: absolute; top: 45%; left: 48%; color: #fff3ab; text-shadow: 0 0 12px #ffbd57, 0 2px 2px #b76e55; font-size: clamp(1.25rem, 4vw, 2.25rem); transform: rotate(calc(var(--index) * 60deg)) translateX(clamp(65px, 16vw, 136px)) rotate(calc(var(--index) * -60deg)); animation: star-burst 1.65s ease-out backwards; animation-delay: calc(2s + var(--index) * .16s); }

@keyframes drift-clouds { from { transform: translateX(12%); } to { transform: translateX(-8%); } }
@keyframes dragon-flight {
  0% { transform: translate(-124%, 20%) scale(.55) rotate(-8deg); }
  29% { transform: translate(-25%, -63%) scale(.92) rotate(-9deg); }
  58% { transform: translate(21%, -42%) rotate(5deg); }
  80% { transform: translate(7%, -62%) rotate(-4deg); }
  100% { transform: translateY(-50%); }
}
@keyframes balloon-rise {
  from { transform: translate(-18%, 110%) rotate(-9deg); }
  66% { transform: translate(3%, -6%) rotate(3deg); }
  to { transform: translate(0) rotate(0); }
}
@keyframes star-burst {
  0% { opacity: 0; transform: rotate(calc(var(--index) * 60deg)) translateX(0) scale(.3); }
  26% { opacity: 1; }
  100% { opacity: 1; }
}

[data-theme="winter"] {
  color: #243c31;
  background: #12392f;
  --cream: #f5f6e9;
  --pink: #f0c5c8;
  --pink-shadow: #c28d9b;
}
[data-theme="winter"] body {
  background: radial-gradient(ellipse at 26% 31%, #386451 0%, transparent 65%), linear-gradient(155deg, #1b4a3e, #112e29);
}
[data-theme="winter"] .game { position: relative; }
[data-theme="winter"] .header { border-color: #bad5b35c; }
[data-theme="winter"] .wordmark { color: #fff7dc; }
[data-theme="winter"] .emblem { background: #f4d69f; border-color: #ddaf62; color: #4b4d36; }
[data-theme="winter"] .menu-button { background: #e8efd7; border-color: #98ad8c; }
[data-theme="winter"] .menu-button:hover { background: #f5f6e9; }
[data-theme="winter"] .menu-button[aria-pressed="true"] { background: #bee0c3; }
[data-theme="winter"] .companion::before { background: #75a684; opacity: .62; }
[data-theme="winter"] .sparkle { color: #ffdfa1; }
[data-theme="winter"] .speech { background: #ecf2da; border-color: #9cbd9b; }
[data-theme="winter"] .speech::before { border-color: #9cbd9b; }
[data-theme="winter"] .board { border-color: #8fb296; box-shadow: 0 9px 0 #071b166e; }
[data-theme="winter"] .fruit-tray { background: #dce9ce; }
[data-theme="winter"] .fruit.lit { background: #ffefc5; outline-color: #995b2d; }
[data-theme="winter"] .modes button:nth-child(2) { background: #d8e9bd; border-color: #8fa773; box-shadow: 0 6px 0 #a7bd8e; }
[data-theme="winter"] .modes button:nth-child(2):hover { background: #e4efce; }
[data-theme="winter"] .lesson-numeral { color: #285b45; }
[data-theme="winter"] .progress li:not([aria-current]):not(.done) { background: #e6eed8; border-color: #8da486; color: #365345; }
[data-theme="winter"] .winter-ribbon .fruit { position: relative; }
[data-theme="winter"] .winter-ribbon .fruit::after {
  content: "";
  position: absolute;
  top: 39%;
  right: 19%;
  width: 20%;
  height: 12%;
  background: #b5435d;
  clip-path: polygon(0 0, 50% 34%, 100% 0, 92% 100%, 50% 66%, 8% 100%);
  transform: rotate(15deg);
}

.snowfall { position: fixed; inset: 0; overflow: hidden; pointer-events: none; --fall: 106vh; }
.snowfall span {
  position: absolute;
  left: var(--x);
  top: -12px;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: #f5fff5;
  opacity: .69;
  animation: falling-snow var(--time) linear var(--delay) infinite;
}
.snowfall span:nth-child(3n) { opacity: .37; }
.scene-snow { position: absolute; z-index: 3; --fall: 360px; }
@keyframes falling-snow { to { transform: translate(32px, var(--fall)); } }

.scene--winter-flight { background: radial-gradient(circle at 76% 22%, #fff8d3 0 7%, transparent 8%), linear-gradient(155deg, #416b7a, #b6d7d1 75%); }
.scene--winter-tree { background: radial-gradient(ellipse at 48% 58%, #527b72, transparent 77%), linear-gradient(#152e3c, #315e53); }
.winter-landscape { overflow: hidden; }
.winter-landscape::after {
  content: "";
  position: absolute;
  inset: auto -20% -27% -20%;
  height: 51%;
  border-radius: 51% 70% 0 0;
  background: #e3efe8;
  box-shadow: 105px -15px 0 #cadfd8, -73px -13px 0 #d5e8df;
}
.forest-tree { position: absolute; bottom: 14%; left: calc(var(--tree) * 15% - 4%); width: 17%; height: var(--height); background: linear-gradient(#b9d5c6, #38664f); clip-path: polygon(50% 0,70% 33%,61% 33%,83% 64%,71% 62%,100% 94%,56% 94%,56% 100%,44% 100%,44% 94%,0 94%,29% 62%,17% 64%,39% 33%,30% 33%); }
.scene--winter-flight .winter-landscape { animation: winter-forest 18s ease-in-out both; }
.scene--winter-flight .scene-cast { width: 59%; left: 20%; top: 43%; transform: translateY(-50%); animation: sleigh-flight 18s ease-in-out both; }
.scene--winter-tree .scene-cast { inset: 5% 22% 4%; animation: tree-reveal 22s ease-in-out both; }
.scene--winter-tree .scene-cast img { height: 100%; object-fit: contain; }
.scene--winter-tree .scene-star { animation: winter-lights 3.6s ease-in-out 4 backwards; animation-delay: calc(5s + var(--index) * .42s); }
@keyframes winter-forest {
  0%, 100% { transform: scale(1.04); }
  43% { transform: translateX(-5%) scale(1.14); }
  78% { transform: translateX(4%) scale(1.1); }
}
@keyframes sleigh-flight {
  0% { transform: translate(-35%, 28%) scale(.62) rotate(-9deg); }
  23% { transform: translate(-12%, -40%) scale(.81) rotate(-11deg); }
  44% { transform: translate(38%, -63%) scale(.98) rotate(4deg); }
  62% { transform: translate(12%, -29%) scale(1.03) rotate(8deg); }
  83% { transform: translate(-12%, -58%) scale(.95) rotate(-7deg); }
  100% { transform: translateY(-50%); }
}
@keyframes tree-reveal {
  0% { transform: translateY(15%) scale(.77); filter: brightness(.79); }
  28% { transform: translateY(2%) scale(.96); filter: brightness(.94); }
  46% { transform: translateY(-2%) scale(1.03); filter: brightness(1.21) drop-shadow(0 0 12px #ffcf7aab); }
  75% { transform: scale(1.02); filter: brightness(1.06) drop-shadow(0 0 6px #ffcf7a7a); }
  100% { transform: none; filter: none; }
}
@keyframes winter-lights {
  0% { opacity: .06; }
  52% { opacity: 1; }
  100% { opacity: .22; }
}

@media (prefers-reduced-motion: reduce) {
  .scene *, .snowfall span { animation: none !important; }
  .snowfall span { top: var(--y); }
}

@media (max-width: 680px) {
  .game { max-width: 520px; padding: 15px 14px 32px; }
  .header { padding: 0 0 12px; gap: 8px; }
  .header:has(#music-button:not([hidden])) { flex-wrap: wrap; }
  .header-controls { gap: 5px; }
  .header-controls .menu-button { padding-inline: 9px; font-size: .86rem; }
  .wordmark { gap: 6px; }
  .emblem { width: 32px; height: 32px; border-radius: 11px; font-size: 1.15rem; }
  .progress { gap: 3px; margin-bottom: 12px; }
  .progress li { width: clamp(19px, 6vw, 23px); height: clamp(19px, 6vw, 23px); }
  .layout { grid-template-columns: 1fr; gap: 10px; margin-top: 8px; }
  .companion { grid-template-columns: 82px minmax(0, 245px); justify-content: center; align-items: center; gap: 14px; }
  .companion::before, .sparkle { display: none; }
  .speech { margin: 0; padding: 8px 11px; border-radius: 14px; text-align: left; font-size: .95rem; }
  .speech::before { left: -6px; top: calc(50% - 5px); width: 9px; height: 9px; transform: rotate(-45deg); }
  .board { padding-top: 20px; min-height: 432px; border-radius: 25px; }
  h1 { margin-bottom: 13px; }
  .modes { gap: 11px; }
  .modes button { min-height: 104px; border-radius: 17px; }
  .fruit-tray { min-height: 161px; padding-block: 9px; }
  .fruit-grid { width: min(100%, 221px); }
  .fruit-grid--wide { width: min(100%, 325px); }
  .lesson-tray { gap: 4px; }
  .answers { margin-top: 17px; }
  .choice { min-height: 58px; font-size: 1.9rem; border-radius: 15px; }
  .reward-tray { padding: 0; }
  .scene { min-height: 190px; }
}
</style>
</head>
<body>

  <main class="game">
    <header class="header">
      <div class="wordmark"><span class="emblem" aria-hidden="true">✦</span> Буся и цифры</div>
      <div class="header-controls">
        <button class="menu-button" id="theme-button" type="button"><span aria-hidden="true">❄</span> Новый год</button>
        <button class="menu-button" id="music-button" type="button" aria-pressed="false" hidden>Музыка</button>
        <button class="menu-button" id="menu-button" type="button" hidden>В меню</button>
      </div>
    </header>

    <div class="layout">
      <aside class="companion" aria-label="Супергероиня Буся">

<script>
'use strict';

// Chorus melody, expressed as MIDI pitches with lengths in beats.
const jingleBells = [
  [64,1],[64,1],[64,2],[64,1],[64,1],[64,2],
  [64,1],[67,1],[60,1.5],[62,.5],[64,3.5],[0,.5],
  [65,1],[65,1],[65,1.5],[65,.5],[65,1],[64,1],[64,1],[64,.5],[64,.5],
  [64,1],[62,1],[62,1],[64,1],[62,2],[67,2],
  [64,1],[64,1],[64,2],[64,1],[64,1],[64,2],
  [64,1],[67,1],[60,1.5],[62,.5],[64,3.5],[0,.5],
  [65,1],[65,1],[65,1.5],[65,.5],[65,1],[64,1],[64,1],[64,.5],[64,.5],
  [67,1],[67,1],[65,1],[62,1],[60,3.5],[0,.5],
];

function createJingleBuffer(context) {
  const beat = .375;
  const rate = context.sampleRate;
  const beats = jingleBells.reduce((sum, [, length]) => sum + length, 0);
  const buffer = context.createBuffer(2, Math.round(beats * beat * rate), rate);
  const left = buffer.getChannelData(0);
  const right = buffer.getChannelData(1);

  function note(pitch, start, duration, volume, pan, voice) {
    const first = Math.round(start * beat * rate);
    const length = Math.min(Math.round(duration * beat * rate), buffer.length - first);
    const phaseStep = 2 * Math.PI * 440 * 2 ** ((pitch - 69) / 12) / rate;
    const leftGain = volume * Math.sqrt((1 - pan) / 2);
    const rightGain = volume * Math.sqrt((1 + pan) / 2);
    for (let i = 0; i < length; i += 1) {
      const time = i / rate;
      const edge = Math.min(1, time / .006, (length - i) / (rate * .03));
      const sample = edge * voice(phaseStep * i, time);
      left[first + i] += leftGain * sample;
      right[first + i] += rightGain * sample;
    }
  }

  function glockenspiel(phase, time) {
    return .82 * Math.sin(phase) * Math.exp(-time * 6)
      + .14 * Math.sin(phase * 2.01) * Math.exp(-time * 12)
      + .09 * Math.sin(phase * 3.94) * Math.exp(-time * 21);
  }

  function pluck(phase, time) {
    return (.7 * Math.sin(phase) + .24 * Math.sin(phase * 2) + .06 * Math.sin(phase * 3))
      * Math.exp(-time * 13);
  }

  function sleighBell(phase, time) {
    return (.44 * Math.sin(phase) + .34 * Math.sin(phase * 1.47) + .22 * Math.sin(phase * 2.29))
      * Math.exp(-time * 24);
  }

  let start = 0;
  jingleBells.forEach(([pitch, duration]) => {
    if (pitch) {
      note(pitch + 12, start, Math.min(duration * 1.05, 2.5), .23, .1, glockenspiel);
      note(pitch, start, Math.min(duration, .85), .085, -.18, pluck);
    }
    start += duration;
  });

  const c = [48, 55, 60, 64, 67];
  const f = [53, 48, 60, 65, 69];
  const g7 = [43, 50, 59, 62, 65];
  const d7 = [50, 45, 60, 62, 66];
  const chords = [c, c, c, c, f, c, d7, g7, c, c, c, c, f, c, g7, c];
  chords.forEach(([root, fifth, ...chord], bar) => {
    const downbeat = bar * 4;
    note(root, downbeat, .9, .115, 0, pluck);
    note(fifth, downbeat + 2, .9, .09, 0, pluck);
    for (const offbeat of [1, 3]) {
      chord.forEach(pitch => note(pitch, downbeat + offbeat, .64, .048, -.5, pluck));
    }
  });

  for (let eighth = 0; eighth < beats * 2; eighth += 1) {
    const accent = eighth % 4 === 2;
    note(accent ? 94 : 96 + eighth % 3, eighth / 2, .43, accent ? .046 : .024, accent ? -.3 : .55, sleighBell);
  }
  return buffer;
}

let jingleContext;
let jingleBuffer;
let jingleSource;

async function setJinglePlaying(playing) {
  if (!playing) {
    if (jingleSource) jingleSource.stop();
    jingleSource = undefined;
    return false;
  }
  if (jingleSource) return true;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return false;
  let source;
  try {
    jingleContext ??= new Audio();
    jingleBuffer ??= createJingleBuffer(jingleContext);
    source = jingleContext.createBufferSource();
    source.buffer = jingleBuffer;
    source.loop = true;
    source.connect(jingleContext.destination);
    source.start();
    jingleSource = source;
    await jingleContext.resume();
    return jingleSource === source && jingleContext.state === 'running';
  } catch {
    if (source && jingleSource === source) {
      source.stop();
      jingleSource = undefined;
    }
    return false;
  }
}

function asset(name) {
  return embeddedImages[name];
}

function itemImage(item) {
  return asset(winter && item.winterFile ? item.winterFile : item.file);
}

function addSnow(container, count) {
  for (let index = 0; index < count; index += 1) {
    const flake = document.createElement('span');
    const duration = 9 + (index * 7 % 12);
    flake.style.setProperty('--x', `${(index * 37 % 97) + 1}%`);
    flake.style.setProperty('--y', `${(index * 23 % 89) + 5}%`);
    flake.style.setProperty('--size', `${3 + (index * 3 % 7)}px`);
    flake.style.setProperty('--time', `${duration}s`);
    flake.style.setProperty('--delay', `${-(index * .31 % 1) * duration}s`);
    container.append(flake);
  }
}

async function syncMusic() {
  const revision = ++musicRevision;
  const playing = await setJinglePlaying(winter && musicWanted);
  if (revision !== musicRevision) return;
  musicButton.setAttribute('aria-pressed', String(playing));
  musicButton.textContent = playing ? 'Музыка играет' : 'Включить музыку';
  if (winter && !playing) musicWanted = false;
}

function switchTheme() {
  winter = !winter;
  document.documentElement.dataset.theme = winter ? 'winter' : 'yellow';
  themeColor.content = winter ? '#12392f' : '#f9df79';
  themeButton.querySelector('span').textContent = winter ? '☀' : '❄';
  themeButton.lastChild.textContent = winter ? ' Жёлтая тема' : ' Новый год';
  musicButton.hidden = !winter;
  snowfall.hidden = !winter;
  if (winter && !snowfall.childElementCount) addSnow(snowfall, 32);
  const grid = tray.querySelector('.fruit-grid');
  if (grid) {
    const url = itemImage(items[grid.dataset.item]);
    grid.querySelectorAll('img').forEach(image => { image.src = url; });
  }
  if (tray.dataset.reward) renderRewardScene(Number(tray.dataset.reward));
  void syncMusic();
}

function shuffle(values) {
  const result = [...values];
  for (let index = result.length - 1; index > 0; index -= 1) {
    const other = Math.floor(Math.random() * (index + 1));
    [result[index], result[other]] = [result[other], result[index]];
  }
  return result;
}

function setAction(label, callback) {
  action.hidden = !callback;
  nextAction = callback;
  action.textContent = label;
}

function showScreen(title, message) {
  stopHint();
  question.textContent = title;
  speech.textContent = message;
  menuButton.hidden = false;
  modes.hidden = true;
  progress.hidden = true;
  tray.hidden = true;
  answers.hidden = true;
  feedback.hidden = true;
  tray.className = 'fruit-tray';
  delete tray.dataset.reward;
  tray.replaceChildren();
  answers.replaceChildren();
  feedback.textContent = '';
  setAction('', undefined);
}

function showMenu(moveFocus = true) {
  showScreen('Выбирай, что будем делать', 'Привет! Давай знакомиться с числами.');
  menuButton.hidden = true;
  modes.hidden = false;
  if (moveFocus) question.focus();
}

function buildFruitGrid(itemIndex, count, tilt) {
  const item = items[itemIndex];
  const grid = document.createElement('div');
  grid.className = 'fruit-grid';
  grid.dataset.item = itemIndex;
  grid.classList.toggle('winter-ribbon', item.file === 'pear' || item.file === 'orange');
  if (count > 5) grid.classList.add('fruit-grid--wide');
  for (let index = 0; index < count; index += 1) {
    const piece = document.createElement('div');
    piece.className = 'fruit';
    if (tilt) piece.style.setProperty('--tilt', `${Math.floor(Math.random() * 23) - 11}deg`);
    const image = new Image(100, 100);
    image.src = itemImage(item);
    image.alt = item.name;
    image.draggable = false;
    piece.append(image);
    grid.append(piece);
  }
  return grid;
}

function showLesson(index) {
  const count = numbers[index];
  const name = numberNames[index];
  showScreen(`Число ${count}`, 'Посмотри, как число записывается.');
  tray.hidden = false;
  tray.classList.add('lesson-tray');
  tray.setAttribute('aria-label', `${name}. Предметы для счёта`);
  const numeral = document.createElement('div');
  numeral.className = 'lesson-numeral';
  const figure = document.createElement('strong');
  figure.textContent = count;
  const word = document.createElement('span');
  word.textContent = name;
  numeral.append(figure, word);
  tray.append(numeral, buildFruitGrid(index % items.length, count, false));
  if (index === numbers.length - 1) setAction('Начать тест', startTest);
  else setAction('Дальше', () => showLesson(index + 1));
  question.focus();
}

function updateProgress() {
  progress.hidden = false;
  progress.replaceChildren(...numbers.map((number, index) => {
    const dot = document.createElement('li');
    const done = index < step || (index === step && solved);
    dot.textContent = done ? '✓' : number;
    dot.setAttribute('aria-label', done ? `Задание ${number} выполнено` : `Задание ${number}`);
    if (done) dot.classList.add('done');
    if (index === step && !done) dot.setAttribute('aria-current', 'step');
    return dot;
  }));
}

function startTest() {
  counts = shuffle(numbers);
  step = 0;
  showQuestion();
}

function showQuestion() {
  const itemIndex = step % items.length;
  const item = items[itemIndex];
  const count = counts[step];
  showScreen(item.question, 'Посчитай предметы и выбери число.');
  mistakes = 0;
  solved = false;
  updateProgress();
  tray.hidden = false;
  tray.setAttribute('aria-label', 'Предметы для счёта');
  tray.append(buildFruitGrid(itemIndex, count, true));
  answers.hidden = false;
  feedback.hidden = false;
  const alternatives = shuffle(numbers.filter(number => number !== count)).slice(0, 2);
  answers.replaceChildren(...shuffle([count, ...alternatives]).map(number => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'choice';
    button.textContent = number;
    button.addEventListener('click', () => choose(number, button, count));
    return button;
  }));
  question.focus();
}

function stopHint() {
  clearInterval(hintTimer);
  tray.querySelector('.lit')?.classList.remove('lit');
}

function showHint() {
  stopHint();
  const pieces = [...tray.querySelectorAll('.fruit')];
  let index = 0;
  pieces[index].classList.add('lit');
  hintTimer = setInterval(() => {
    pieces[index].classList.remove('lit');
    index += 1;
    if (index === pieces.length) {
      clearInterval(hintTimer);
      return;
    }
    pieces[index].classList.add('lit');
  }, 600);
}

function continueTest() {
  step += 1;
  showQuestion();
}

function choose(number, button, count) {
  if (solved) return;
  answers.querySelector('.wrong')?.classList.remove('wrong');
  if (number !== count) {
    mistakes += 1;
    button.classList.add('wrong');
    feedback.textContent = mistakes === 1 ? 'Посчитай ещё раз.' : 'Считай по одному.';
    if (mistakes >= 2) showHint();
    return;
  }
  stopHint();
  solved = true;
  const completed = step + 1;
  if (rewards[completed]) {
    showReward(completed);
    return;
  }
  updateProgress();
  button.classList.add('correct');
  feedback.textContent = `Верно! Ответ — ${count}.`;
  setAction('Дальше', continueTest);
  action.focus();
  answers.querySelectorAll('button').forEach(choice => { choice.disabled = true; });
}

function showReward(completed) {
  const final = completed === numbers.length;
  showScreen('', '');
  updateProgress();
  tray.hidden = false;
  tray.classList.add('reward-tray');
  tray.dataset.reward = completed;
  renderRewardScene(completed);
  setAction(final ? 'Сыграть ещё' : 'Дальше', final ? startTest : continueTest);
  question.focus();
}

function renderRewardScene(completed) {
  const final = completed === numbers.length;
  const reward = (winter ? winterRewards : rewards)[completed];
  question.textContent = reward.title;
  speech.textContent = reward.speech;
  tray.setAttribute('aria-label', reward.description);
  const scene = document.createElement('div');
  scene.className = `scene scene--${reward.className}`;
  scene.setAttribute('aria-hidden', 'true');

  const sky = document.createElement('div');
  sky.className = 'scene-sky';
  if (winter) {
    sky.classList.add('winter-landscape');
    for (let index = 0; index < 7; index += 1) {
      const tree = document.createElement('span');
      tree.className = 'forest-tree';
      tree.style.setProperty('--tree', index);
      tree.style.setProperty('--height', `${20 + (index * 13 % 24)}%`);
      sky.append(tree);
    }
    const snow = document.createElement('div');
    snow.className = 'snowfall scene-snow';
    addSnow(snow, 21);
    scene.append(snow);
  } else {
    for (let index = 0; index < 3; index += 1) {
      const cloud = document.createElement('span');
      cloud.className = `cloud cloud--${index + 1}`;
      sky.append(cloud);
    }
  }
  const cast = document.createElement('div');
  cast.className = 'scene-cast';
  if (final) {
    const stars = document.createElement('div');
    stars.className = 'scene-stars';
    for (let index = 0; index < 6; index += 1) {
      const star = document.createElement('span');
      star.textContent = '✦';
      star.className = 'scene-star';
      star.style.setProperty('--index', index);
      stars.append(star);
    }
    scene.append(stars);
  }
  const sprite = new Image();
  sprite.src = asset(reward.file);
  sprite.alt = '';
  cast.append(sprite);
  scene.prepend(sky, cast);
  tray.replaceChildren(scene);
}

menuButton.addEventListener('click', () => showMenu());
document.querySelector('#learn-button').addEventListener('click', () => showLesson(0));
document.querySelector('#test-button').addEventListener('click', startTest);
action.addEventListener('click', () => nextAction?.());
themeButton.addEventListener('click', switchTheme);
musicButton.addEventListener('click', () => {
  musicWanted = !musicWanted;
  void syncMusic();
});
showMenu(false);
</script>
</body>
</html>
